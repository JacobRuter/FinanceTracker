# For an image built locally by ./build.sh (no registry involved).
# Paste into Portainer: Stacks -> Add stack -> Web editor.
# pull_policy: never stops Portainer trying to pull a non-existent registry image.
services:
  finance-tracker:
    image: finance-tracker:local
    pull_policy: never
    container_name: finance-tracker
    ports:
      - "${PORT:-8090}:8080"
    environment:
      TZ: ${TZ:-America/New_York}
      DB_PATH: /data/finance.db
    volumes:
      - finance-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/months')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  finance-data:
